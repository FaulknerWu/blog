upstream api {
    server api:8080;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # 与 API 的媒体上传上限（20 MB 文件 + 1 MB multipart 余量）一致
    client_max_body_size 21m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /media/ {
        proxy_pass http://api;
    }

    location ~ ^/(feed\.xml|rss\.xml|sitemap\.xml|robots\.txt|healthz)$ {
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://web;
    }
}
