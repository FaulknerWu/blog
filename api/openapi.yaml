openapi: 3.1.0
info:
  title: Blog API
  version: 1.0.0
  description: |
    博客系统 HTTP 接口契约，是接口实现、前端类型与 CLI 客户端的唯一事实来源。
    通用约定（字段命名、时间格式、分页、条件请求、错误结构）见 docs/api-design.md。

    - 请求与响应为 `application/json; charset=utf-8`，错误为 `application/problem+json`（RFC 9457）。
    - 可选字段无值时显式返回 `null`；请求体包含未定义字段时返回 `400`。
    - 管理接口接受浏览器会话（`session`）或 API 令牌（`bearer`）。令牌须拥有操作的 `x-scope`；会话拥有全部 scope。
    - 跨站请求校验（`Sec-Fetch-Site: same-origin` 且 `Origin` 与站点一致）只作用于会话鉴权的非安全方法与登录。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 与站点同源，由 Nginx 按路径转发到 API
tags:
  - name: public
    description: 公开内容
  - name: auth
    description: 认证、会话与 API 令牌
  - name: render
    description: 正文渲染
  - name: posts
    description: 文章管理
  - name: pages
    description: 页面管理
  - name: taxonomy
    description: 标签与专栏管理
  - name: media
    description: 媒体管理与图片分发
  - name: settings
    description: 站点设置
  - name: distribution
    description: 订阅源、Sitemap 与健康检查

security: []

paths:
  # ───────────────────────── 公开内容 ─────────────────────────
  /api/posts:
    get:
      tags: [public]
      operationId: listPosts
      summary: 已发布文章列表
      description: 按 `published_at` 倒序分页。
      parameters:
        - name: tag
          in: query
          description: 按标签 slug 筛选
          schema: { type: string }
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 文章分页
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostSummaryList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/posts/{slug}:
    get:
      tags: [public]
      operationId: getPost
      summary: 已发布文章详情
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 文章详情
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '301': { $ref: '#/components/responses/MovedPermanently' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/pages/{slug}:
    get:
      tags: [public]
      operationId: getPage
      summary: 已发布页面详情
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 页面详情
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '301': { $ref: '#/components/responses/MovedPermanently' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tags:
    get:
      tags: [public]
      operationId: listTags
      summary: 标签列表
      description: 只含至少有一篇已发布文章的标签，按名称排序，不分页。
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 标签列表
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '304': { $ref: '#/components/responses/NotModified' }

  /api/tags/{slug}:
    get:
      tags: [public]
      operationId: getTag
      summary: 标签详情
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 标签
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/series:
    get:
      tags: [public]
      operationId: listSeries
      summary: 专栏列表
      description: 只含包含已发布文章的专栏，按 `last_published_at` 倒序，不分页。
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 专栏列表
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesList' }
        '304': { $ref: '#/components/responses/NotModified' }

  /api/series/{slug}:
    get:
      tags: [public]
      operationId: getSeries
      summary: 专栏详情
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 专栏及其已发布文章目录
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/search:
    get:
      tags: [public]
      operationId: searchPosts
      summary: 全文检索
      description: 按相关度排序，不分页。
      parameters:
        - name: q
          in: query
          required: true
          description: 去除首尾空白后 1–64 个字符
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 检索结果
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/settings:
    get:
      tags: [public]
      operationId: getSiteSettings
      summary: 公开站点设置
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 站点设置
          headers: { ETag: { $ref: '#/components/headers/WeakETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSettings' }
        '304': { $ref: '#/components/responses/NotModified' }

  # ───────────────────────── 认证 ─────────────────────────
  /api/auth/sessions:
    post:
      tags: [auth]
      operationId: login
      summary: 登录
      description: 成功后下发 `__Host-session` Cookie。要求通过跨站请求校验；按客户端 IP 限流。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '201':
          description: 登录成功
          headers:
            Set-Cookie:
              description: '`__Host-session=<token>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [auth]
      operationId: listSessions
      summary: 活跃会话列表
      security: [{ session: [] }]
      responses:
        '200':
          description: 当前用户的全部活跃会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: 退出登录
      description: 吊销当前会话并清除 Cookie。
      security: [{ session: [] }]
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: 吊销指定会话
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前用户与凭据信息
      security: [{ session: [] }, { bearer: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: 修改密码
      description: 更新密码并吊销当前会话以外的全部会话；API 令牌不受影响。
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: 已修改 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: API 令牌列表
      security: [{ session: [] }]
      responses:
        '200':
          description: 当前用户的全部令牌（含已过期）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      operationId: createToken
      summary: 签发 API 令牌
      description: 令牌明文 `secret` 只在本次响应中出现。
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '201':
          description: 已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/tokens/{id}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: 吊销 API 令牌
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 渲染 ─────────────────────────
  /api/admin/render:
    get:
      tags: [render]
      operationId: getRenderer
      summary: 当前渲染器版本
      description: 由其他版本渲染的内容即为过期内容（空正文除外）。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:read
      responses:
        '200':
          description: 渲染器信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendererInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [render]
      operationId: renderPreview
      summary: 渲染预览
      description: 渲染正文但不保存。渲染问题（错误与警告）随结果返回，不作为错误响应。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderInput' }
      responses:
        '200':
          description: 渲染结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────── 文章 ─────────────────────────
  /api/admin/posts:
    get:
      tags: [posts]
      operationId: adminListPosts
      summary: 文章列表（含草稿与定时发布）
      description: 按 `updated_at` 倒序分页。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:read
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/PostState' }
        - name: q
          in: query
          description: 按标题子串筛选
          schema: { type: string }
        - name: tag_id
          in: query
          schema: { type: integer, format: int64 }
        - name: slug
          in: query
          description: 按 slug 精确匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Stale'
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 文章分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostSummaryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [posts]
      operationId: createPost
      summary: 创建文章（草稿）
      description: '服务端调用渲染服务渲染正文，渲染错误以 `422`（`code: render_error`，带 `line`）返回。'
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: 已创建
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/admin/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [posts]
      operationId: adminGetPost
      summary: 文章详情（含 Markdown 原文）
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:read
      responses:
        '200':
          description: 文章
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPost' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [posts]
      operationId: updatePost
      summary: 保存文章内容
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '200':
          description: 已保存
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: 删除文章
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:publish
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/admin/posts/{id}/publication:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [posts]
      operationId: publishPost
      summary: 立即发布或定时发布
      description: |
        请求体可为空。`published_at` 省略或为 `null` 时沿用首次发布时间，从未发布过则取当前时间；
        晚于当前时间即为定时发布。正文为空时返回 `422`。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:publish
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishInput' }
      responses:
        '200':
          description: 已发布
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [posts]
      operationId: unpublishPost
      summary: 撤回发布
      description: 状态恢复为 `draft`，保留 `published_at`。已是草稿时不修改。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:publish
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200':
          description: 已撤回
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ───────────────────────── 页面 ─────────────────────────
  /api/admin/pages:
    get:
      tags: [pages]
      operationId: adminListPages
      summary: 页面列表（含草稿）
      description: 按 `updated_at` 倒序，不分页。
      security: [{ session: [] }, { bearer: [] }]
      x-scope: content:read
      parameters:
        - name: slug
          in: query
          description: 按 slug 精确匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Stale'
      responses:
        '200':
          description: 页面列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPageSummaryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
