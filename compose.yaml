name: blog

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: blog
      POSTGRES_DB: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog", "-d", "blog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  render:
    build: ./render
    restart: unless-stopped

  api:
    build: ./api
    environment:
      BLOG_DATABASE_URL: postgres://blog:${POSTGRES_PASSWORD}@db:5432/blog?sslmode=disable
      BLOG_SITE_URL: ${BLOG_SITE_URL:?set BLOG_SITE_URL in .env}
      BLOG_RENDER_URL: http://render:8090
      BLOG_TRUST_PROXY: "true"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      render:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db:
  media:
